<!DOCTYPE html>
<html>
<head>
  <style>
    header {
      background-color: #4a90e2;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 18px;
    }

    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">My Portfolio</div>

  <nav>
    <a href="#">About</a>
    <a href="#">Skills</a>
    <a href="#">Contact</a>
  </nav>
</header>

</body>
</html>
